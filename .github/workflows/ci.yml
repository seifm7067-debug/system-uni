name: CI & Quality Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: system_uni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Check Ruff Formatting
        run: uv run ruff format --check .

      - name: Run Bandit Security Scan
        run: uv run bandit -q -r app

      - name: Build Legacy Schema on Postgres
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/system_uni_test
          SECRET_KEY: CI_valid_secret_key_4mQ8x2L7pR5vN9sT3wY6zA1bC0dE
        run: uv run alembic upgrade 261ef2b9bad0

      - name: Verify Migration with Existing Enrollment Data
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/system_uni_test
          SECRET_KEY: CI_valid_secret_key_4mQ8x2L7pR5vN9sT3wY6zA1bC0dE
          RUN_MIGRATION_COMPATIBILITY_TESTS: "1"
        run: uv run pytest -v tests/test_postgres_migrations.py::test_enrollment_code_migration_preserves_existing_rows

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/system_uni_test
          SECRET_KEY: CI_valid_secret_key_4mQ8x2L7pR5vN9sT3wY6zA1bC0dE
          RUN_POSTGRES_INTEGRATION_TESTS: "1"
        run: uv run pytest -v
